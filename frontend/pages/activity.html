<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chef Bisu | Activity Log</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>:root{--bg:#0c0c0e;--card:#17171b;--gold:#d4a437;--dim:#9a9a9f;--border:rgba(255,255,255,.08)}*{box-sizing:border-box}body{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);color:#f5f5f4;font-family:Inter,system-ui;padding:18px}.top{display:flex;gap:12px;align-items:center;margin-bottom:25px}.back,.refresh{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:#fff}.refresh{margin-left:auto;color:var(--gold)}.eyebrow{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.8px}.top h1{font-size:19px;margin:1px 0}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:6px 16px}.item{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}.icon{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(212,164,55,.14);color:var(--gold);display:grid;place-items:center}.action{font-weight:700;font-size:13px}.details,.date,.empty{font-size:11px;color:var(--dim)}.date{margin-top:4px}.empty{text-align:center;padding:22px 0}</style></head><body><header class="top"><button class="back" id="backButton" aria-label="Dashboard-এ ফিরুন"><i class="bi bi-arrow-left"></i></button><div><div class="eyebrow">ADMINISTRATION</div><h1>Activity Log</h1></div><button class="refresh" id="refreshButton" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button></header><main><section class="panel" id="activityList"><div class="empty">Loading...</div></section></main><script src="../js/activity.js"></script></body></html>
