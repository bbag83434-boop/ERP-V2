<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chef Bisu | Backup</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>:root{--bg:#0c0c0e;--card:#17171b;--gold:#d4a437;--dim:#9a9a9f;--border:rgba(255,255,255,.08)}*{box-sizing:border-box}body{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);color:#f5f5f4;font-family:Inter,system-ui;padding:18px}.top{display:flex;gap:12px;align-items:center;margin-bottom:28px}.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:#fff}.eyebrow{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.8px}.top h1{font-size:19px;margin:1px 0}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}.backup-icon{width:58px;height:58px;border-radius:16px;background:rgba(212,164,55,.14);color:var(--gold);display:grid;place-items:center;font-size:25px;margin-bottom:16px}.panel h2{font-size:17px}.muted{color:var(--dim);font-size:13px;line-height:1.6}.notice{background:#101014;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;color:var(--dim);margin:16px 0}.btn-gold{background:var(--gold);border:0;color:#17120a;font-weight:700;padding:12px}.status{font-size:12px;color:var(--dim);text-align:center;margin-top:14px}</style></head><body><header class="top"><button class="back" id="backButton" aria-label="Dashboard-এ ফিরুন"><i class="bi bi-arrow-left"></i></button><div><div class="eyebrow">ADMINISTRATION</div><h1>Data Backup</h1></div></header><main><section class="panel"><div class="backup-icon"><i class="bi bi-database-down"></i></div><h2>পূর্ণ Data Backup</h2><p class="muted">বর্তমান ERP data একটি JSON backup file হিসেবে আপনার device-এ download হবে। এটি নিরাপদ স্থানে রাখুন।</p><div class="notice"><i class="bi bi-info-circle me-1"></i> এই backup-এ user, item, stock, production, transfer এবং অন্যান্য business data থাকবে।</div><button class="btn btn-gold w-100" id="downloadButton"><i class="bi bi-download me-1"></i> Backup Download</button><div class="status" id="backupStatus"></div></section></main><script src="../js/backup.js"></script></body></html>
