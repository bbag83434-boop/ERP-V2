<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chef Bisu | Branches</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0c0c0e; --card:#17171b; --card-2:#1e1e23; --gold:#d4a437; --gold-soft:rgba(212,164,55,.14); --text:#f5f5f4; --text-dim:#9a9a9f; --border:rgba(255,255,255,.08); --danger:#e5544d; }
        * { box-sizing:border-box; }
        body { max-width:430px; min-height:100vh; margin:0 auto; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
        h1, h2, h3 { font-family:'Poppins',sans-serif; }
        .page-header { display:flex; align-items:center; gap:12px; padding:18px; border-bottom:1px solid var(--border); }
        .back-button { width:40px; height:40px; border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; text-decoration:none; }
        .back-button:active { transform:scale(.96); background:var(--card-2); }
        .page-header h1 { margin:0; font-size:19px; font-weight:700; }
        .page-header p { margin:2px 0 0; color:var(--text-dim); font-size:12px; }
        main { padding:18px; }
        .panel { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; }
        .panel + .panel { margin-top:14px; }
        .panel-title { display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:14px; font-weight:700; }
        .panel-title i { color:var(--gold); font-size:18px; }
        .form-control { min-height:46px; background:#101014; border-color:var(--border); color:var(--text); border-radius:12px; }
        .form-control::placeholder { color:var(--text-dim); }
        .form-control:focus { background:#101014; border-color:var(--gold); color:var(--text); box-shadow:0 0 0 .2rem var(--gold-soft); }
        .btn-gold { min-height:46px; border:0; border-radius:12px; background:var(--gold); color:#18130a; font-weight:700; }
        .btn-gold:hover, .btn-gold:focus { background:#e1b64d; color:#18130a; }
        .branch-list { display:flex; flex-direction:column; gap:10px; }
        .branch-row { display:flex; align-items:center; gap:12px; min-height:62px; padding:11px 12px; border:1px solid var(--border); border-radius:14px; background:#101014; }
        .branch-icon { width:38px; height:38px; flex:0 0 38px; display:flex; align-items:center; justify-content:center; border-radius:11px; background:var(--gold-soft); color:var(--gold); }
        .branch-name { min-width:0; flex:1; margin:0; overflow-wrap:anywhere; font-size:13px; font-weight:600; }
        .delete-button { width:36px; height:36px; border:1px solid rgba(229,84,77,.35); border-radius:10px; background:rgba(229,84,77,.10); color:var(--danger); }
        .empty-state { padding:20px 8px 4px; color:var(--text-dim); text-align:center; font-size:13px; }
        .status-message { min-height:20px; margin:10px 2px 0; color:var(--text-dim); font-size:12px; }
        .status-message.error { color:#ff8780; }
    </style>
</head>
<body>
    <header class="page-header">
        <a class="back-button" href="dashboard.html" aria-label="Back to dashboard"><i class="bi bi-arrow-left"></i></a>
        <div>
            <h1>Branches</h1>
            <p>Manage outlet branches</p>
        </div>
    </header>

    <main>
        <section class="panel" aria-labelledby="addBranchTitle">
            <h2 class="panel-title" id="addBranchTitle"><i class="bi bi-building-add"></i>Add Branch</h2>
            <form id="branchForm" novalidate>
                <label class="visually-hidden" for="branchName">Branch name</label>
                <div class="d-flex gap-2">
                    <input id="branchName" class="form-control" type="text" maxlength="100" placeholder="Enter branch name" autocomplete="off" required>
                    <button class="btn btn-gold px-3" type="submit" aria-label="Add branch"><i class="bi bi-plus-lg"></i></button>
                </div>
                <p id="formMessage" class="status-message" aria-live="polite"></p>
            </form>
        </section>

        <section class="panel" aria-labelledby="branchListTitle">
            <h2 class="panel-title" id="branchListTitle"><i class="bi bi-buildings"></i>Branch List</h2>
            <div id="branchList" class="branch-list" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const branchForm = document.getElementById("branchForm");
        const branchNameInput = document.getElementById("branchName");
        const branchList = document.getElementById("branchList");
        const formMessage = document.getElementById("formMessage");

        function setFormMessage(message, isError = false) {
            formMessage.textContent = message;
            formMessage.classList.toggle("error", isError);
        }

        function createBranchRow(branch) {
            const row = document.createElement("div");
            row.className = "branch-row";

            const icon = document.createElement("div");
            icon.className = "branch-icon";
            icon.innerHTML = '<i class="bi bi-building"></i>';

            const name = document.createElement("p");
            name.className = "branch-name";
            name.textContent = branch.branch_name || "Unnamed branch";

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-button";
            deleteButton.setAttribute("aria-label", `Delete ${name.textContent}`);
            deleteButton.innerHTML = '<i class="bi bi-trash3"></i>';
            deleteButton.addEventListener("click", () => deleteBranch(branch.id, name.textContent));

            row.append(icon, name, deleteButton);
            return row;
        }

        async function loadBranches() {
            branchList.innerHTML = '<p class="empty-state">Loading branches...</p>';

            try {
                const response = await fetch("/api/production/branches");
                if (!response.ok) throw new Error("Unable to load branches");

                const branches = await response.json();
                branchList.innerHTML = "";

                if (!Array.isArray(branches) || branches.length === 0) {
                    branchList.innerHTML = '<p class="empty-state">No branches added yet.</p>';
                    return;
                }

                branches.forEach((branch) => branchList.appendChild(createBranchRow(branch)));
            } catch (error) {
                console.error("Branch list load failed:", error);
                branchList.innerHTML = '<p class="empty-state">Branches are unavailable. Please refresh and try again.</p>';
            }
        }

        async function deleteBranch(id, branchName) {
            if (!id || !window.confirm(`Delete ${branchName}?`)) return;

            try {
                const response = await fetch(`/api/production/branches/${encodeURIComponent(id)}`, { method: "DELETE" });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Unable to delete branch");

                setFormMessage(data.message || "Branch deleted successfully.");
                loadBranches();
            } catch (error) {
                console.error("Branch deletion failed:", error);
                setFormMessage(error.message || "Unable to delete branch.", true);
            }
        }

        branchForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const branchName = branchNameInput.value.trim();

            if (!branchName) {
                setFormMessage("Enter a branch name.", true);
                branchNameInput.focus();
                return;
            }

            setFormMessage("Saving branch...");

            try {
                const response = await fetch("/api/production/branches", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ branch_name: branchName })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Unable to add branch");

                branchNameInput.value = "";
                setFormMessage(data.message || "Branch added successfully.");
                loadBranches();
            } catch (error) {
                console.error("Branch save failed:", error);
                setFormMessage(error.message || "Unable to add branch.", true);
            }
        });

        (async function verifySession() {
            try {
                const response = await fetch("/session");
                const data = await response.json();
                if (!data.loggedIn) window.location.replace("/login.html");
            } catch (error) {
                console.error("Session verification failed:", error);
                window.location.replace("/login.html");
            }
        })();

        loadBranches();
    </script>
</body>
</html>
