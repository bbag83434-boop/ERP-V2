<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Chef Bisu</title>

<meta name="theme-color" content="#0b0b0b">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/login.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" href="/assets/icons/favicon-32.png">
<link rel="stylesheet" href="../css/pwa-prompt.css">
<meta name="theme-color" content="#0c0c0e">

</head>

<body>

<div class="aurora">

<div class="light one"></div>

<div class="light two"></div>

<div class="light three"></div>

<div id="particles"></div>

</div>

<div class="login-screen">

<div class="login-card">

<div class="logo-box">

<img src="../assets/chef-bisu-logo.png">

</div>

<h1>

Chef Bisu

</h1>

<p>

Restaurant & Sweet Shop Management

</p>

<form id="loginForm">
    <div class="input-group-custom">

<i class="bi bi-person-fill"></i>

<input
type="text"
id="username"
placeholder="Username"
required>

</div>
<div class="input-group-custom">

<i class="bi bi-lock-fill"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<button
type="button"
id="togglePassword">

<i class="bi bi-eye"></i>

</button>

</div>
<button
type="submit"
class="login-btn">

<span>

LOGIN

</span>

</button>

</form>

</div>

</div>

<div
id="loadingOverlay"
class="loading-overlay d-none">

<div class="loader-ring"></div>

<h4>Signing In...</h4>

</div>

<div
id="successOverlay"
class="success-overlay d-none">

<div class="success-circle">

<i class="bi bi-check-lg"></i>

</div>

<h3>

Welcome Back

</h3>

</div>
<!-- PWA Install Bar -->
<div id="pwaInstallBar" class="pwa-bar d-none">
  <span><i class="bi bi-download"></i> Install Chef Bisu App</span>
  <button id="installNowBtn">Install Now</button>
</div>

<!-- PWA Update Bar -->
<div id="pwaUpdateBar" class="pwa-bar d-none">
  <span><i class="bi bi-arrow-repeat"></i> New update available</span>
  <button id="updateNowBtn">Update Now</button>
</div>
<script src="../js/login.js"></script>

</body>

</html>
