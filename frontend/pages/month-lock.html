<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef Bisu | Month Lock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--bg:#0c0c0e;--card:#17171b;--gold:#d4a437;--dim:#9a9a9f;--border:rgba(255,255,255,.08)}*{box-sizing:border-box}body{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);color:#f5f5f4;font-family:Inter,system-ui,sans-serif;padding:18px 18px 38px}.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}.back{width:40px;height:40px;border:1px solid var(--border);background:var(--card);color:#fff;border-radius:12px}.eyebrow{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.8px}.top h1{font-size:19px;margin:1px 0 0}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:17px;margin-bottom:14px}.panel h2{font-size:15px;margin:0 0 5px}.muted{font-size:12px;color:var(--dim);margin:0 0 15px}.form-label{font-size:12px;color:var(--dim)}.form-control{background:#101014;border:1px solid var(--border);color:#fff;padding:11px}.form-control:focus{background:#101014;border-color:var(--gold);color:#fff;box-shadow:none}.btn-gold{background:var(--gold);border:0;color:#16120a;font-weight:700;padding:11px}.btn-outline-gold{border-color:rgba(212,164,55,.55);color:var(--gold);padding:10px}.lock-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.lock-row:last-child{border:0}.lock-icon{width:34px;height:34px;border-radius:10px;background:rgba(212,164,55,.14);color:var(--gold);display:grid;place-items:center}.lock-month{font-weight:700;font-size:14px}.empty{color:var(--dim);font-size:13px;text-align:center;padding:15px 0}</style>
</head>
<body>
<header class="top"><button class="back" type="button" id="backButton" aria-label="Dashboard-এ ফিরুন"><i class="bi bi-arrow-left"></i></button><div><div class="eyebrow">ADMINISTRATION</div><h1>Month Lock</h1></div></header>
<main>
<section class="panel"><h2>মাস Lock করুন</h2><p class="muted">Lock করা মাসে নতুন production entry যোগ করা যাবে না।</p><label class="form-label" for="lockMonth">মাস নির্বাচন করুন</label><div class="d-flex gap-2"><input class="form-control" id="lockMonth" type="month"><button class="btn btn-gold text-nowrap" id="lockButton" type="button">Lock</button></div></section>
<section class="panel"><h2>নতুন মাস শুরু করুন</h2><p class="muted">আগের মাসের closing stock নতুন মাসের opening stock হবে।</p><div class="row g-2"><div class="col-6"><label class="form-label" for="fromMonth">আগের মাস</label><input class="form-control" id="fromMonth" type="month"></div><div class="col-6"><label class="form-label" for="toMonth">নতুন মাস</label><input class="form-control" id="toMonth" type="month"></div></div><button class="btn btn-outline-gold w-100 mt-3" id="createMonthButton" type="button">Opening Stock তৈরি করুন</button></section>
<section class="panel"><div class="d-flex justify-content-between align-items-center mb-2"><div><h2 class="mb-0">Locked Months</h2><p class="muted mb-0">Unlock করতে মাস নির্বাচন করুন।</p></div><button class="btn btn-sm btn-outline-gold" id="refreshButton" type="button"><i class="bi bi-arrow-clockwise"></i></button></div><div id="lockedMonths"><div class="empty">Loading...</div></div></section>
</main>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"><div class="toast text-bg-dark border" id="appToast" role="status"><div class="d-flex"><div class="toast-body" id="toastMessage"></div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/month-lock.js"></script>
</body></html>
