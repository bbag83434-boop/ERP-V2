<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opening Stock | Chef Bisu ERP</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

:root{

--bg:#0c0c0e;
--card:#17171b;
--gold:#d4a437;
--text:#ffffff;
--muted:#9ca3af;
--border:rgba(255,255,255,.08);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:var(--bg);
color:var(--text);
font-family:'Inter',sans-serif;
max-width:430px;
margin:auto;
min-height:100vh;

}

.page{

padding-bottom:90px;

}

/* ================= Header ================= */

.topbar{

height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
background:#111114;
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:100;

}

.icon-btn{

width:42px;
height:42px;
border:none;
border-radius:12px;
background:#1b1b20;
color:#fff;

}

.page-title h5{

margin:0;
font-family:'Poppins',sans-serif;
font-weight:600;

}

.page-title small{

color:#9ca3af;

}

/* ================= Cards ================= */

.summary-card{

background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:18px;

}

.summary-title{

font-size:13px;
color:#9ca3af;

}

.summary-value{

font-size:26px;
font-weight:700;
margin-top:6px;

}

.section-title{

font-family:'Poppins',sans-serif;
font-size:18px;
font-weight:600;
margin-bottom:14px;

}

    </style>

</head>

<body>

<div class="page">

<!-- ================= HEADER ================= -->

<header class="topbar">

<button id="menuToggle" class="icon-btn">

<i class="bi bi-list fs-4"></i>

</button>

<div class="page-title text-center">

<h5>Opening Stock</h5>

<small>Chef Bisu ERP</small>

</div>

<button class="icon-btn">

<i class="bi bi-person-circle fs-4"></i>

</button>

</header>

<div class="container py-3">
    <!-- ================= SUMMARY ================= -->

<div class="row g-3 mb-3">

    <div class="col-4">

        <div class="summary-card text-center">

            <div class="summary-title">Items</div>

            <div id="totalItems" class="summary-value">0</div>

        </div>

    </div>

    <div class="col-4">

        <div class="summary-card text-center">

            <div class="summary-title">Qty</div>

            <div id="totalQty" class="summary-value">0</div>

        </div>

    </div>

    <div class="col-4">

        <div class="summary-card text-center">

            <div class="summary-title">Status</div>

            <div id="stockStatus" class="summary-value text-warning">
                Draft
            </div>

        </div>

    </div>

</div>

<!-- ================= MONTH ================= -->

<div class="summary-card mb-3">

    <div class="section-title">

        Opening Month

    </div>

    <input
        type="month"
        id="openingMonth"
        class="form-control">

</div>

<!-- ================= SEARCH ================= -->

<div class="summary-card mb-3">

    <div class="section-title">

        Search Item

    </div>

    <input
        type="text"
        id="searchItem"
        class="form-control"
        placeholder="Search Item...">

</div>

<!-- ================= TABLE ================= -->

<div class="summary-card">

    <div class="section-title">

        Opening Stock List

    </div>

    <div class="table-responsive">

        <table class="table table-dark align-middle">

            <thead>

                <tr>

                    <th>Item</th>

                    <th>Unit</th>

                    <th width="110">Qty</th>

                </tr>

            </thead>

            <tbody id="openingStockTable">

                <!-- JS will load items -->

            </tbody>

        </table>

    </div>

</div>

<!-- ================= BUTTON ================= -->

<div class="d-grid mt-4">

    <button
        id="saveOpeningStock"
        class="btn btn-warning btn-lg">

        <i class="bi bi-floppy"></i>

        Save Opening Stock

    </button>

</div>
<!-- ================= FOOTER ================= -->

</div>
<!-- End Container -->

<!-- MENU OVERLAY -->
<div id="menuOverlay" class="menu-overlay"></div>

<!-- SIDEBAR -->
<aside id="appSidebar" class="app-sidebar">

    <!-- Sidebar এখানেই Dashboard-এর একই Sidebar Paste করবে -->

</aside>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Opening Stock JS -->
<script src="../js/opening-stock.js"></script>

<!-- Sidebar JS -->
<script>

const menuToggle = document.getElementById("menuToggle");
const menuClose = document.getElementById("menuClose");
const sidebar = document.getElementById("appSidebar");
const overlay = document.getElementById("menuOverlay");

function openMenu() {

    sidebar.classList.add("show");
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";

}

function closeMenu() {

    sidebar.classList.remove("show");
    overlay.classList.remove("show");
    document.body.style.overflow = "";

}

if(menuToggle){
    menuToggle.addEventListener("click", openMenu);
}

if(menuClose){
    menuClose.addEventListener("click", closeMenu);
}

if(overlay){
    overlay.addEventListener("click", closeMenu);
}

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){
        closeMenu();
    }

});

</script>

</div>
</body>
</html>
