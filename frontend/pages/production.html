<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Chef Bisu | Production</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/loading.css">
<link rel="stylesheet" href="../css/production.css">

</head>

<body>

<div class="d-flex justify-content-between align-items-center px-3 pt-3">

    <button id="backBtn" class="btn btn-dark rounded-4">
        <i class="bi bi-arrow-left"></i>
    </button>

    <div class="d-flex align-items-center">

        <img
            src="../assets/chef-bisu-logo.png"
            class="logo">

        <div class="ms-2">

            <div class="fw-bold">

                Chef
                <span class="gold">
                    Bisu
                </span>

            </div>

            <small class="text-secondary">

                Production

            </small>

        </div>

    </div>

    <button class="btn btn-dark rounded-4">

        <i class="bi bi-fire"></i>

    </button>

</div>

<!-- Tabs -->

<div class="px-3 mt-3">

    <div class="tab-switch">

        <button
            id="newTab"
            class="active">

            New

        </button>

        <button
            id="historyTab">

            History

        </button>

        <button
            id="searchTab">

            Search

        </button>

    </div>
<div id="newScreen">

    <div class="px-3 mt-3">

        <button class="date-card">

            <i class="bi bi-calendar3"></i>

            <span id="productionDateText"></span>

            <i class="bi bi-chevron-down"></i>

        </button>

        <input
            type="date"
            id="productionDate"
            hidden>

    </div>

    <div class="container mt-4">

        <div class="card">

            <div class="card-body">

                <h5 class="mb-4">

                    Add Production

                </h5>

                <div class="mb-3">

                    <label class="form-label">

                        Item

                    </label>

                    <select
                        id="item"
                        class="form-select">

                        <option value="">

                            Select Item

                        </option>

                    </select>

                </div>

                <div class="row">

                    <div class="col-6">

                        <label class="form-label">

                            Quantity

                        </label>

                        <input
                            id="qty"
                            type="number"
                            min="1"
                            class="form-control"
                            placeholder="Enter Qty">

                    </div>

                    <div class="col-6">

                        <label class="form-label">

                            Unit

                        </label>

                        <select
                            id="unit"
                            class="form-select">

                            <option value="PCS">PCS</option>
                            <option value="KG">KG</option>

                        </select>

                    </div>

                </div>

                <div class="mt-4">

                    <button
                        id="addRowBtn"
                        class="btn btn-warning w-100 fw-bold rounded-3">

                        <i class="bi bi-plus-circle me-2"></i>

                        Add Row

                    </button>

                </div>

            </div>

        </div>
        <div class="mt-4">

    <h6 class="text-white mb-3">

        Production List

    </h6>

    <div id="productionList">

        <div id="emptyState"
             class="text-center py-4 rounded-4 border border-secondary">

            <i class="bi bi-inbox fs-1 text-secondary"></i>

            <p class="text-secondary mt-3 mb-0">

                No production item added

            </p>

        </div>

    </div>

    <button
        id="saveBtn"
        class="btn btn-warning w-100 fw-bold rounded-3 mt-4">

        <i class="bi bi-save me-2"></i>

        Save Production

    </button>

</div>

</div>

</div>

</div>
</div>
<!-- ================= History ================= -->

<div id="historyScreen" style="display:none;">

    <div class="px-3 mt-3">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="mb-0">

                <i class="bi bi-clock-history text-warning me-2"></i>

                Production History

            </h5>

            <button
                id="refreshHistoryBtn"
                class="btn btn-dark rounded-3">

                <i class="bi bi-arrow-clockwise"></i>

            </button>

        </div>

        <div id="historyList">

            <div
                class="text-center py-5 text-secondary">

                <i class="bi bi-clock-history fs-1"></i>

                <p class="mt-3 mb-0">

                    No production history found

                </p>

            </div>

        </div>

    </div>

</div>
<!-- ================= Search ================= -->

<div id="searchScreen" style="display:none;">

    <div class="container mt-3">

        <div class="card">

            <div class="card-body">

                <h5 class="mb-4">

                    Search Production

                </h5>

                <div class="row">

                    <div class="col-6">

                        <label class="form-label">

                            From Date

                        </label>

                        <input
                            type="date"
                            id="fromDate"
                            class="form-control">

                    </div>

                    <div class="col-6">

                        <label class="form-label">

                            To Date

                        </label>

                        <input
                            type="date"
                            id="toDate"
                            class="form-control">

                    </div>

                </div>

                <button
                    id="searchBtn"
                    class="btn btn-warning w-100 fw-bold rounded-3 mt-4">

                    <i class="bi bi-search me-2"></i>

                    Search

                </button>

            </div>

        </div>

        <div
            id="searchResult"
            class="mt-4">

        </div>

    </div>

</div>
<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">

    <div class="loading-box">

        <div class="loader"></div>

        <h5 id="loadingTitle">
            Saving Production...
        </h5>

        <p id="loadingText">
            Please wait...
        </p>

    </div>

</div>

<!-- Success Overlay -->
<div id="successOverlay" class="loading-overlay">

    <div class="loading-box">

        <div class="success-circle">

            <i class="bi bi-check-lg"></i>

        </div>

        <h5>

            Production Saved

        </h5>

        <p>

            Successfully

        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/loading.js"></script>

<script src="../js/production.js"></script>

</body>

</html>
