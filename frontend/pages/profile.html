<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chef Bisu | Profile</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --card: #17171b;
      --card-2: #1e1e23;
      --gold: #d4a437;
      --gold-soft: rgba(212, 164, 55, .14);
      --text: #f5f5f4;
      --text-dim: #9a9a9f;
      --border: rgba(255, 255, 255, .07);
      --ok: #3fbf6f;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 14px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      text-decoration: none;
    }

    .page-title {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 19px;
      font-weight: 700;
    }

    .page-subtitle {
      margin: 1px 0 0;
      color: var(--text-dim);
      font-size: 12px;
    }

    main { padding: 2px 18px 30px; }

    .profile-card {
      position: relative;
      overflow: hidden;
      padding: 28px 20px 22px;
      background: linear-gradient(145deg, #202025, var(--card));
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: -78px;
      left: 50%;
      width: 220px;
      height: 160px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--gold-soft);
      filter: blur(8px);
    }

    .avatar {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: #252018;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 0 0 7px rgba(212, 164, 55, .08);
    }

    .status-dot {
      position: absolute;
      right: 1px;
      bottom: 3px;
      width: 17px;
      height: 17px;
      border: 3px solid var(--card);
      border-radius: 50%;
      background: var(--ok);
    }

    .user-name {
      position: relative;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .role-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 9px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .section-title {
      margin: 25px 0 10px;
      color: var(--text-dim);
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .details-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 67px;
      padding: 12px 14px;
    }

    .detail-row + .detail-row { border-top: 1px solid var(--border); }

    .detail-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 11px;
      background: var(--gold-soft);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .detail-label {
      margin: 0 0 2px;
      color: var(--text-dim);
      font-size: 10.5px;
    }

    .detail-value {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .account-note {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      padding: 13px 14px;
      border: 1px solid rgba(212, 164, 55, .18);
      border-radius: 14px;
      background: rgba(212, 164, 55, .07);
      color: var(--text-dim);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .account-note i { color: var(--gold); font-size: 16px; }

    .loading { color: var(--text-dim); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back-btn" href="dashboard.html" aria-label="Back to dashboard">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div>
      <h1 class="page-title">My Profile</h1>
      <p class="page-subtitle">Your Chef Bisu ERP account</p>
    </div>
  </header>

  <main>
    <section class="profile-card" aria-label="User profile">
      <div class="avatar" aria-hidden="true">
        <i class="bi bi-person-fill"></i>
        <span class="status-dot"></span>
      </div>
      <h2 class="user-name loading" id="profileName">Loading profile...</h2>
      <span class="role-badge"><i class="bi bi-patch-check-fill"></i><span id="profileRole">Active user</span></span>
    </section>

    <h3 class="section-title">Account details</h3>
    <section class="details-card" aria-label="Account details">
      <div class="detail-row">
        <div class="detail-icon"><i class="bi bi-person"></i></div>
        <div>
          <p class="detail-label">Username</p>
          <p class="detail-value loading" id="usernameValue">Loading...</p>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon"><i class="bi bi-shield-check"></i></div>
        <div>
          <p class="detail-label">Account role</p>
          <p class="detail-value loading" id="roleValue">Loading...</p>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon"><i class="bi bi-check-circle"></i></div>
        <div>
          <p class="detail-label">Account status</p>
          <p class="detail-value">Active</p>
        </div>
      </div>
    </section>

    <div class="account-note">
      <i class="bi bi-info-circle"></i>
      <span>Your account details are managed by the Chef Bisu ERP administrator.</span>
    </div>
  </main>

  <script>
    (async function loadProfile() {
      try {
        const response = await fetch('/session', { credentials: 'include' });
        const data = await response.json();

        if (!response.ok || !data.loggedIn || !data.user) {
          window.location.replace('/login.html');
          return;
        }

        const username = data.user.username || 'User';
        const role = data.user.role || 'Active user';

        document.getElementById('profileName').textContent = username;
        document.getElementById('usernameValue').textContent = username;
        document.getElementById('profileRole').textContent = role;
        document.getElementById('roleValue').textContent = role;

        document.querySelectorAll('.loading').forEach((element) => {
          element.classList.remove('loading');
        });
      } catch (error) {
        console.error('Unable to load profile:', error);
        window.location.replace('/login.html');
      }
    })();
  </script>
</body>
</html>
