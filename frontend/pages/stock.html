<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chef Bisu | Stock</title>

<!-- Bootstrap -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
rel="stylesheet">

<style>

:root{

--bg:#0c0c0e;
--card:#17171b;
--gold:#d4a437;
--text:#ffffff;
--muted:#a8a8b3;
--border:rgba(255,255,255,.08);

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

background:var(--bg);
color:var(--text);
font-family:Inter,sans-serif;

}

.app{

max-width:430px;
margin:auto;
min-height:100vh;
background:var(--bg);

}

.topbar{

height:64px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 18px;

border-bottom:1px solid var(--border);

position:sticky;

top:0;

background:#0c0c0e;

z-index:100;

}

.topbar h5{

margin:0;

font-family:Poppins,sans-serif;

font-weight:700;

}

.icon-btn{

width:42px;

height:42px;

border-radius:12px;

border:none;

background:#1d1d22;

color:#fff;

}

.page-body{

padding:18px;

}

.card-dark{

background:var(--card);

border:1px solid var(--border);

border-radius:18px;

padding:18px;

margin-bottom:18px;

}

.card-title{

font-size:13px;

color:var(--muted);

margin-bottom:12px;

}

.summary{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

margin-bottom:18px;

}

.summary-box{

background:#1d1d22;

border-radius:16px;

padding:16px;

text-align:center;

}

.summary-box h6{

font-size:12px;

color:var(--muted);

margin-bottom:8px;

}

.summary-box h3{

margin:0;

font-size:22px;

font-weight:700;

color:var(--gold);

}

.form-control{

background:#202026;

border:1px solid var(--border);

color:#fff;

}

.form-control:focus{

background:#202026;

color:#fff;

border-color:var(--gold);

box-shadow:none;

}

.btn-gold{

background:var(--gold);

border:none;

color:#000;

font-weight:700;

border-radius:14px;

height:48px;

}

.table-dark-custom{

width:100%;

border-collapse:collapse;

}

.table-dark-custom th{

background:#202026;

padding:14px;

font-size:13px;

}

.table-dark-custom td{

padding:14px;

border-top:1px solid var(--border);

font-size:13px;

}

.table-wrapper{

overflow:auto;

border-radius:16px;

}

</style>

</head>

<body>

<div class="app">

<header class="d-flex justify-content-between align-items-center px-3 pt-3 pb-2">

    <button id="backBtn" class="btn btn-dark rounded-4">
        <i class="bi bi-arrow-left"></i>
    </button>

    <h4 class="m-0 fw-bold">Stock</h4>

    <div style="width:48px;"></div>

</header>

<div class="page-body">
    <!-- ================= SUMMARY ================= -->

<div class="summary">

    <div class="summary-box">

        <h6>Opening</h6>

        <h3 id="totalOpening">0</h3>

    </div>

    <div class="summary-box">

        <h6>Production</h6>

        <h3 id="totalProduction">0</h3>

    </div>

    <div class="summary-box">

        <h6>Transfer</h6>

        <h3 id="totalTransfer">0</h3>

    </div>
    <div class="summary-box">

    <h6>Wastage</h6>

    <h3 id="totalWastage">0</h3>

</div>
    <div class="summary-box">

        <h6>Closing</h6>

        <h3 id="totalClosing">0</h3>

    </div>

</div>

<!-- ================= FILTER ================= -->

<div class="card-dark">

    <div class="card-title">

        Stock Filter

    </div>

    <div class="mb-3">

        <label class="form-label">

            Select Month

        </label>

        <!-- পুরোনো ID একই রাখা হয়েছে -->
        <input
            type="month"
            id="stockMonth"
            class="form-control">

    </div>

    <button
        id="loadStockBtn"
        class="btn btn-gold w-100">

        <i class="bi bi-search"></i>

        Show Stock

    </button>

</div>

<!-- ================= STOCK TABLE ================= -->

<div class="card-dark">

    <div class="card-title">

        Monthly Stock

    </div>

    <div class="table-wrapper">

        <table class="table-dark-custom">

            <thead>

<tr>

    <th>Item</th>

    <th>Opening</th>

    <th>Production</th>

    <th>Transfer</th>

    <th>Wastage</th>

    <th>Closing</th>

</tr>

</thead>

<tbody id="stockTableBody">

</tbody>

        </table>

    </div>

</div>
<!-- ================= MENU OVERLAY ================= -->

<div id="menuOverlay" class="menu-overlay"></div>

<!-- ================= SIDEBAR ================= -->

<aside id="appSidebar" class="app-sidebar">

    <!-- Dashboard-এর একই Sidebar এখানে Paste করবে -->

</aside>

</div>
<!-- End page-body -->

</div>
<!-- End app -->

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auth -->

<script src="../js/auth.js"></script>

<!-- Stock Logic (আগেরটাই থাকবে) -->

<script src="../js/stock.js"></script>

<!-- Sidebar -->

<script>

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("appSidebar");
const overlay = document.getElementById("menuOverlay");

function openMenu(){

    sidebar.classList.add("show");
    overlay.classList.add("show");

    document.body.style.overflow="hidden";

}

function closeMenu(){

    sidebar.classList.remove("show");
    overlay.classList.remove("show");

    document.body.style.overflow="";

}

menuToggle.addEventListener("click",openMenu);

overlay.addEventListener("click",closeMenu);

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        closeMenu();

    }

});

</script>

</body>
</html>
