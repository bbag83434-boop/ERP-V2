<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chef Bisu | Users</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0c0c0e;
            --card: #17171b;
            --card-2: #1e1e23;
            --gold: #d4a437;
            --gold-soft: rgba(212,164,55,.14);
            --text: #f5f5f4;
            --text-dim: #9a9a9f;
            --border: rgba(255,255,255,.08);
            --danger: #e5544d;
        }

        * { box-sizing: border-box; }

        body {
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        h1, h2 { font-family: 'Poppins', sans-serif; }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px;
            border-bottom: 1px solid var(--border);
        }

        .back-button {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            text-decoration: none;
        }

        .back-button:active { transform: scale(.96); background: var(--card-2); }

        .page-header h1 { margin: 0; font-size: 19px; font-weight: 700; }
        .page-header p { margin: 2px 0 0; color: var(--text-dim); font-size: 12px; }

        main { padding: 18px; }

        .panel {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
        }

        .panel + .panel { margin-top: 14px; }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 16px;
            font-size: 14px;
            font-weight: 700;
        }

        .panel-title i { color: var(--gold); font-size: 18px; }

        .form-label { margin-bottom: 6px; color: var(--text-dim); font-size: 11px; font-weight: 600; }

        .form-control,
        .form-select {
            min-height: 46px;
            border-color: var(--border);
            border-radius: 12px;
            background-color: #101014;
            color: var(--text);
        }

        .form-control::placeholder { color: var(--text-dim); }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--gold);
            background-color: #101014;
            color: var(--text);
            box-shadow: 0 0 0 .2rem var(--gold-soft);
        }

        .form-select option { background: #17171b; color: var(--text); }

        .btn-gold {
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            background: var(--gold);
            color: #18130a;
            font-weight: 700;
        }

        .btn-gold:hover,
        .btn-gold:focus { background: #e1b64d; color: #18130a; }

        .user-table-wrap {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .user-table { margin: 0; color: var(--text); }
        .user-table > :not(caption) > * > * { padding: 13px 12px; border-bottom-color: var(--border); background: #101014; color: inherit; vertical-align: middle; }
        .user-table thead th { background: var(--card-2); color: var(--text-dim); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
        .user-table tbody td { font-size: 13px; }
        .user-table tbody td:last-child { width: 64px; text-align: right; }
        .user-table .btn-outline-danger { border-color: rgba(229,84,77,.35); background: rgba(229,84,77,.10); color: #ff8780; }
        .user-table .btn-outline-danger:hover { border-color: var(--danger); background: var(--danger); color: #fff; }

        @media (max-width: 350px) {
            .panel { padding: 14px; }
            .user-table > :not(caption) > * > * { padding: 11px 9px; }
        }
    </style>
</head>

<body>
    <header class="page-header">
        <a class="back-button" href="dashboard.html" aria-label="Back to dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h1>Users</h1>
            <p>Manage system access</p>
        </div>
    </header>

    <main>
        <section class="panel" aria-labelledby="addUserTitle">
            <h2 class="panel-title" id="addUserTitle"><i class="bi bi-person-plus"></i>Add User</h2>

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="newUsername">Username</label>
                    <input type="text" id="newUsername" class="form-control" placeholder="Enter username" autocomplete="username">
                </div>
                <div class="col-12">
                    <label class="form-label" for="newPassword">Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter password" autocomplete="new-password">
                </div>
                <div class="col-12">
                    <label class="form-label" for="newUserRole">Role</label>
                    <select id="newUserRole" class="form-select">
                        <option value="Admin">Admin</option>
                        <option value="User">User</option>
                    </select>
                </div>
                <div class="col-12">
                    <button id="saveUserBtn" class="btn btn-gold w-100" type="button">
                        <i class="bi bi-person-plus me-2"></i>Add User
                    </button>
                </div>
            </div>
        </section>

        <section class="panel" aria-labelledby="userListTitle">
            <h2 class="panel-title" id="userListTitle"><i class="bi bi-people"></i>User List</h2>
            <div class="user-table-wrap">
                <div class="table-responsive">
                    <table class="table user-table align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Username</th>
                                <th scope="col">Role</th>
                                <th scope="col" aria-label="Action"></th>
                            </tr>
                        </thead>
                        <tbody id="userListBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/users.js"></script>
</body>
</html>
