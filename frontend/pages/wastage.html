<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chef Bisu | Wastage</title>

<link rel="manifest" href="../manifest.json">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/loading.css">

<style>

:root{

--bg:#08080c;

--card:#171722;

--card2:#1f2030;

--gold:#D8B24A;

--text:#ffffff;

--muted:#9ea3b4;

--border:rgba(255,255,255,.08);

}

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}

body{

background:var(--bg);

color:var(--text);

max-width:430px;

margin:auto;

min-height:100vh;

padding-bottom:100px;

}

.container-page{

padding:18px;

}

.topbar{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:18px;

}

.icon-btn{

width:46px;

height:46px;

border-radius:16px;

background:#111;

border:1px solid var(--border);

display:flex;

align-items:center;

justify-content:center;

color:#fff;

font-size:20px;

text-decoration:none;

}

.brand{

display:flex;

align-items:center;

gap:10px;

}

.brand img{

width:42px;

height:42px;

border-radius:50%;

}

.brand h5{

margin:0;

font-size:20px;

font-weight:700;

}

.brand small{

display:block;

color:var(--muted);

}
.top-tabs{

display:flex;

background:#141421;

padding:6px;

border-radius:18px;

margin-bottom:20px;

border:1px solid var(--border);

}

.top-tabs button{

flex:1;

height:52px;

border:none;

background:transparent;

color:#fff;

font-weight:600;

border-radius:14px;

transition:.25s;

}

.top-tabs button.active{

background:linear-gradient(180deg,#F3D777,#D8B24A);

color:#111;

}

.date-card{

background:linear-gradient(180deg,#202235,#1a1c2d);

border:1px solid var(--border);

border-radius:18px;

height:64px;

padding:0 18px;

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.date-card i{

font-size:18px;

color:var(--gold);

}

.date-card span{

font-size:18px;

font-weight:600;

}

.form-card{

background:linear-gradient(180deg,#22243a,#1a1c2e);

border:1px solid rgba(255,255,255,.08);

border-radius:22px;

padding:20px;

margin-bottom:20px;

box-shadow:0 15px 35px rgba(0,0,0,.30);

}

.form-title{

font-size:22px;

font-weight:700;

margin-bottom:18px;

color:var(--gold);

}

.form-label{

font-size:14px;

margin-bottom:8px;

color:#d8d8d8;

}

.input-box{

height:52px;

background:#2A2C42;

border:1px solid rgba(255,255,255,.08);

border-radius:12px;

color:#fff;

}

.input-box:focus{

background:#2A2C42;

color:#fff;

border-color:var(--gold);

box-shadow:none;

}
#wastageDate{

background:transparent;

border:none;

color:#fff;

box-shadow:none;

}

#wastageDate:focus{

border:none;

box-shadow:none;

outline:none;

}
</style>

</head>

<body>

<div class="container-page">

<div class="topbar">

<a href="user-dashboard-new.html"
class="icon-btn">

<i class="bi bi-arrow-left"></i>

</a>

<div class="brand">

<img src="../assets/chef-bisu-logo.png">

<div>

<h5>Chef Bisu</h5>

<small>Wastage</small>

</div>

</div>

<a href="#"
class="icon-btn">

<i class="bi bi-fire"></i>

</a>

</div>

<div class="top-tabs">

<button class="active">

New

</button>

<button>

History

</button>

<button>

Search

</button>

</div>
<div id="newSection">
<div class="date-card">

    <i class="bi bi-calendar3"></i>

    <input
        type="date"
        id="wastageDate"
        class="form-control input-box flex-grow-1 border-0 bg-transparent text-white">

    <i class="bi bi-chevron-down"></i>

</div>

<div class="form-card">

<div class="form-title">

Add Wastage

</div>
<div class="mb-3">

<label class="form-label">

Item

</label>

<select class="form-select input-box" id="wastageItem">

<option value="">

Select Item

</option>

</select>

</div>

<div class="row">

<div class="col-6">

<label class="form-label">

Quantity

</label>

<input type="number"
class="form-control input-box"
id="wastageQty"
placeholder="Enter Qty">

</div>

<div class="col-6">

<label class="form-label">

Unit

</label>

<select class="form-select input-box"
id="wastageUnit">

<option>PCS</option>

<option>KG</option>

<option>LTR</option>

<option>GM</option>

<option>BOX</option>

</select>

</div>

</div>

<div class="mt-3">

<label class="form-label">

Reason

</label>

<select class="form-select input-box"
id="wastageReason">

<option value="">

Select Reason

</option>

<option>Expired</option>

<option>Damaged</option>

<option>Spoiled</option>

<option>Broken</option>

<option>Quality Issue</option>

<option>Other</option>

</select>

</div>

<div class="mt-4">

<button
class="btn w-100 fw-bold"
id="addRowBtn"
style="
height:52px;
background:linear-gradient(180deg,#F3D777,#D8B24A);
border:none;
border-radius:14px;
color:#111;
font-size:17px;">

<i class="bi bi-plus-circle me-2"></i>

Add Row

</button>

</div>

</div>

<!-- =====================
     WASTAGE LIST
====================== -->

<h5 class="fw-bold mb-3">

Wastage List

</h5>

<div id="wastageList">

<div class="card border-0 mb-3"
style="
background:#23253A;
border-radius:18px;">

<div class="card-body">

<div class="d-flex
justify-content-between
align-items-center">

<div>

<h6 class="mb-1">

No Item Added

</h6>

<small class="text-secondary">

Tap "Add Row" to add wastage.

</small>

</div>

<i class="bi bi-trash3
text-danger fs-5"></i>

</div>

</div>

</div>

</div>
<!-- ==========================
     SAVE BUTTON
========================== -->

<div class="d-grid mt-4 mb-4">

<button
id="saveWastageBtn"
class="btn btn-lg fw-bold"
style="
height:56px;
background:linear-gradient(180deg,#F3D777,#D8B24A);
color:#111;
border:none;
border-radius:16px;">

<i class="bi bi-check-circle me-2"></i>

Save Wastage

</button>

</div>
</div>
<!-- ==========================
     HISTORY SECTION
========================== -->

<div id="historySection" style="display:none;">

<div class="form-card">

<div class="d-flex justify-content-between align-items-center mb-3">

    <h5 class="fw-bold mb-0">
        Wastage History
    </h5>

    <button
        id="refreshHistoryBtn"
        class="btn btn-sm btn-outline-warning">

        <i class="bi bi-arrow-clockwise"></i>

    </button>

</div>

<div id="historyList">

<div class="text-center py-5 text-secondary">

<i class="bi bi-clock-history fs-1"></i>

<p class="mt-3 mb-0">

No Wastage History Found

</p>

</div>

</div>

</div>

</div>

<!-- ==========================
     SEARCH SECTION
========================== -->

<div id="searchSection" style="display:none;">

<div class="form-card">

<h5 class="mb-3 fw-bold">

Search Wastage

</h5>

<label class="form-label">Item</label>

<select
id="searchItem"
class="form-select input-box mb-3">

    <option value="">All Items</option>

</select>

<input
type="date"
id="searchDate"
class="form-control input-box mb-3">

<button
id="searchBtn"
onclick="searchWastage()"
class="btn btn-warning w-100 fw-bold"
style="height:50px;border-radius:14px;">

<i class="bi bi-search me-2"></i>

Search

</button>
<div id="searchResult" class="mt-3"></div>
</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>

// Tab Switching

const tabs = document.querySelectorAll(".top-tabs button");

const newSection = document.getElementById("newSection");
const history = document.getElementById("historySection");
const search = document.getElementById("searchSection");

tabs.forEach((tab,index)=>{

tab.onclick=function(){

tabs.forEach(t=>t.classList.remove("active"));

this.classList.add("active");

newSection.style.display = index === 0 ? "block" : "none";
history.style.display = index === 1 ? "block" : "none";
search.style.display = index === 2 ? "block" : "none";
if(index===1){
    loadHistory();
}
}

});

// Add Row Placeholder



</script>
<div id="loadingOverlay" class="loading-overlay">

    <div class="loading-box">

        <div class="loader"></div>

        <h5 id="loadingTitle">
            Saving Production...
        </h5>

        <p id="loadingText">
            Please wait...
        </p>

    </div>

</div>

<!-- Success Overlay -->
<div id="successOverlay" class="loading-overlay">

    <div class="loading-box">

        <div class="success-circle">

            <i class="bi bi-check-lg"></i>

        </div>

        <h5>

            Production Saved

        </h5>

        <p>

            Successfully

        </p>
     </div>
    </div>
<script src="../js/loading.js"></script>
<script src="../js/wastage.js"></script>

</body>

</html>
